# Le nom de l'app est choisi/ajusté par `fly launch --copy-config`
app = "le-prochain-date"
primary_region = "cdg"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
